<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, minimum-scale=1">
<title>meikilab</title>
<link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="meikilab"><meta name="theme-color" content="#09090d">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3f8;--sf:#fff;--tx:#14141a;--mut:#6f6f7d;--bd:rgba(20,20,30,.09);--hl:rgba(20,20,40,.06);--ac:#7c3aed;--gl:rgba(255,255,255,.78);--g:linear-gradient(135deg,#7c3aed,#ec4899);--h:270;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09090d;--sf:#15151c;--tx:#f5f5f8;--mut:#8f8f9e;--bd:rgba(255,255,255,.09);--hl:rgba(255,255,255,.07);--ac:#a78bfa;--gl:rgba(22,22,30,.74);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#09090d;--sf:#15151c;--tx:#f5f5f8;--mut:#8f8f9e;--bd:rgba(255,255,255,.09);--hl:rgba(255,255,255,.07);--ac:#a78bfa;--gl:rgba(22,22,30,.74);color-scheme:dark}
html,body{overflow-x:hidden;max-width:100%}
header{flex-wrap:wrap;gap:12px}
header>div{min-width:0}
.lkb input,.kw input{width:0}
.empty{width:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--tx);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:18px 18px 150px;max-width:520px;margin-inline:auto;
background:radial-gradient(120% 55% at 50% -8%,rgba(139,92,246,.24),transparent 62%),var(--bg);background-attachment:fixed;min-height:100vh}
button{font-family:inherit;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:flex-end;margin:10px 0 20px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(25px,7.5vw,32px);line-height:1.1;margin:4px 0 0;font-weight:800;letter-spacing:-.03em}
.add,.btn{background:var(--g);color:#fff;border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 8px 22px -6px rgba(168,85,247,.6)}
.add svg{width:16px;height:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--hl);color:var(--tx);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;transition:.2s}
.chip.on{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 6px 18px -6px rgba(168,85,247,.7)}
.newpl{display:flex;gap:8px;margin-bottom:12px}
.newpl input{flex:1;background:var(--hl);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;font-size:15px;font-family:inherit;outline:0}
.newpl input:focus{border-color:var(--ac)}
#list{display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;gap:14px;padding:9px 10px;border-radius:18px;transition:background .2s;animation:in .35s both}
.row:active{background:var(--hl)}
.row.cur{background:var(--hl);box-shadow:inset 0 0 0 1px var(--bd)}
.cv{width:56px;height:56px;border-radius:15px;flex:none;display:grid;place-items:center;font-size:22px;color:#fff;box-shadow:0 10px 20px -8px rgba(0,0,0,.45)}
.meta{flex:1;min-width:0}
.nm{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur .nm{color:var(--ac)}
.fx{font-size:12px;color:var(--mut);margin-top:3px;font-weight:500}
.dots{background:none;border:0;color:var(--mut);font-size:22px;width:40px;height:40px;border-radius:50%}
.dots:active{background:var(--hl)}
.eq{display:flex;gap:3px;align-items:flex-end;height:20px}
.eq i{width:4px;background:#fff;border-radius:2px;height:100%;transform-origin:bottom;animation:eq .9s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.25s}.eq i:nth-child(3){animation-delay:.5s}
body.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--mut);font-size:14px;line-height:1.5;padding:44px 24px;border:1px dashed var(--bd);border-radius:24px;background:var(--hl)}
.empty b{color:var(--tx);font-size:17px}
.eico{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;font-size:34px;background:var(--g);box-shadow:0 14px 30px -10px rgba(168,85,247,.7);margin-bottom:6px}
.lkb,.kw{display:flex;gap:8px;margin:0 0 8px}
.lkb input,.kw input{flex:1;min-width:0;background:var(--hl);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:13px 15px;font-size:15px;font-family:inherit;outline:0}
.lkb input:focus,.kw input:focus{border-color:var(--ac)}
.ls{font-size:12px;color:var(--mut);min-height:16px;margin:0 4px 12px;font-weight:600}
.row.cur .cv .eq{filter:drop-shadow(0 1px 4px rgba(0,0,0,.75))}
.fi{width:100%;background:var(--hl);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;margin-bottom:8px;outline:0}
#en{font-weight:800;font-size:17px}
.lkb .pb{padding:11px 14px;background:var(--hl);color:var(--tx);box-shadow:none;border:1px solid var(--bd)}
#pl2 .r2{flex-wrap:wrap}#pl2 .r2 button{font-size:13px;padding:13px 4px;min-width:42%}
#pl2{isolation:isolate}
#pl2 .mesh{position:absolute;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.mesh i{position:absolute;width:90vw;height:90vw;max-width:520px;max-height:520px;border-radius:50%;filter:blur(70px);opacity:.5;animation:drift 16s ease-in-out infinite alternate}
.mesh i:nth-child(1){left:-25vw;top:-10vw;background:hsl(var(--h) 85% 52%)}
.mesh i:nth-child(2){right:-30vw;top:48%;background:hsl(calc(var(--h) + 70) 85% 52%);animation-delay:-8s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(18vw,12vw) scale(1.25)}}
#pl2 .art{border-radius:50%;box-shadow:none;background:none;position:relative;transform:scale(var(--pulse,1));transition:transform .12s linear}
body.paused #pl2 .art{transform:scale(.9);transition:transform .5s}
.disc{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:80px;color:#fff;position:relative;background-size:cover;
box-shadow:0 40px 80px -20px rgba(0,0,0,.65),0 0 0 10px rgba(255,255,255,.06),inset 0 0 0 2px rgba(255,255,255,.18);animation:spin var(--sp,8s) linear infinite}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 5px,rgba(0,0,0,.08) 5px 6px)}
.disc::after{content:"";position:absolute;width:15%;aspect-ratio:1;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 3px rgba(255,255,255,.22)}
body.paused .disc{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.ft.mq{text-overflow:clip;-webkit-mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.ft span{display:inline-block;white-space:nowrap}
.ft.mq span{animation:mq 12s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
#vz{width:100%;height:56px;margin:0 0 14px}
.hw{position:relative;margin:-10px 0 8px}.hrt{background:none;border:0;color:#ec4899;font-size:32px}
.pt{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;animation:pt .7s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.mb{background:none;border:0;color:var(--tx);width:38px;height:44px;display:grid;place-items:center;flex:none}
.pc{flex:none;width:96px;padding:12px 6px;border-radius:18px;border:1px solid var(--bd);background:var(--hl);color:var(--tx);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
.pc b{font-size:24px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--g)}
.del{color:#f0525c;background:none;border:0;font-size:14px;font-weight:600;padding:10px 0}
.mini{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:496px;margin:auto;background:var(--gl);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--bd);border-radius:24px;box-shadow:0 18px 40px -12px rgba(0,0,0,.5);overflow:hidden;z-index:10}
.mini.on{display:block;animation:in .35s both}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 12px 12px 10px}
.mrow .cv{width:46px;height:46px;border-radius:12px;font-size:18px;background:var(--g)}
.mt{flex:1;min-width:0}
.bt{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bs{font-size:12px;color:var(--mut);margin-top:2px;min-height:15px}
.mprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--hl)}
.mprog i{display:block;height:100%;width:0;background:var(--g)}
.pp{border:0;background:var(--tx);color:var(--bg);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.pp svg{width:50%;height:50%}
#pl2{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 26px calc(22px + env(safe-area-inset-bottom,0px));
background:radial-gradient(110% 60% at 50% 0%,hsl(var(--h) 65% 38%),var(--bg) 72%),var(--bg);transform:translateY(102%);transition:transform .42s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
#pl2.o{transform:none}
.xc{align-self:flex-start;background:var(--hl);border:0;color:var(--tx);width:42px;height:42px;border-radius:50%;font-size:20px}
.art{width:min(76vw,310px);aspect-ratio:1;border-radius:30px;display:grid;place-items:center;font-size:92px;color:rgba(255,255,255,.92);margin:auto 0 28px;box-shadow:0 40px 80px -20px rgba(0,0,0,.6);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
body.paused .art{transform:scale(.88)}
.ft{font-size:22px;font-weight:800;letter-spacing:-.02em;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs{font-size:13px;color:var(--mut);margin:4px 0 22px;font-weight:500;min-height:16px}
.skw{width:100%}
input.sk{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;outline:0;background:linear-gradient(90deg,var(--tx) var(--p,0%),var(--hl) var(--p,0%))}
input.sk::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tm{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:8px;font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:center;gap:30px;margin:22px 0 18px}
.ctl button{background:none;border:0;color:var(--tx);width:52px;height:52px;display:grid;place-items:center}
.ctl .pp{width:76px;height:76px;background:var(--g);color:#fff;box-shadow:0 18px 36px -10px rgba(168,85,247,.8)}
.r2{display:flex;gap:10px;width:100%;margin-top:auto;padding-top:10px}
.r2 button{flex:1;border:1px solid var(--bd);background:var(--hl);color:var(--tx);padding:14px;border-radius:16px;font-weight:700;font-size:14px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:flex-end;z-index:40}
#sheet.o{display:flex}
.sh{background:var(--sf);width:100%;max-width:520px;margin:auto;border-radius:28px 28px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .35s cubic-bezier(.2,.8,.2,1)}
.sh::before{content:"";display:block;width:40px;height:5px;border-radius:5px;background:var(--hl);margin:0 auto 16px}
@keyframes up{from{transform:translateY(40%);opacity:0}}
.sh h3{margin:0 0 14px;font-size:18px;font-weight:800;letter-spacing:-.02em}
label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin:16px 0 8px}
label b{color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac)}
input[type=file]{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div><div class="eyebrow">meikilab</div><h1>Ma bibliothèque</h1></div>
<label class="add" for="f" style="margin:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Ajouter</label></header>
<div class="lkb"><input id="lk" type="text" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="Colle un lien TikTok ou Instagram"><button class="btn pb" id="pst" aria-label="Coller">📋</button><button class="btn" id="lkb">Importer</button></div>
<div class="kw" id="kw" style="display:none"><input id="kin" type="password" placeholder="Clé d’accès du serveur"><button class="btn" id="kok">OK</button></div>
<div class="ls" id="ls"></div>
<input id="q" class="fi" placeholder="🔎 Rechercher un son…" style="margin-bottom:12px">
<input id="f" type="file" accept="audio/*,video/*" multiple>
<div class="chips" id="pls"></div>
<div class="newpl" id="np" style="display:none"><input id="npi" placeholder="Nom de la playlist" maxlength="40"><button class="btn" id="npok">OK</button></div>
<div id="list"></div>
<div id="dp" style="text-align:center;margin-top:10px"></div>

<div class="mini" id="mini"><div class="mrow"><div class="cv" id="mcv">♪</div>
<div class="mt"><div class="bt" id="bt">Aucun son</div><div class="bs" id="bs"></div></div>
<button class="mb" id="mpv" aria-label="Précédent"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button><button class="pp" id="pp" aria-label="Lecture"></button><button class="mb" id="mnx" aria-label="Suivant"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button></div><div class="mprog"><i id="mp"></i></div></div>
<div id="pl2"><div class="mesh"><i></i><i></i></div><button class="xc" id="xc" aria-label="Fermer">⌄</button>
<div class="art" id="art"><div class="disc" id="disc">♪</div></div><div class="ft" id="ft"></div><div class="fs" id="fs"></div><div class="hw" id="hw"><button class="hrt" id="hrt" aria-label="J’aime">♡</button></div><canvas id="vz" width="600" height="112"></canvas>
<div class="skw"><input type="range" class="sk" id="sk" min="0" max="1000" value="0"><div class="tm"><span id="t1">0:00</span><span id="t2">0:00</span></div></div>
<div class="ctl"><button id="pv" aria-label="Précédent"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg></button>
<button class="pp" id="pp2" aria-label="Lecture"></button>
<button id="nx" aria-label="Suivant"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button></div>
<div class="r2"><button id="lp">🔂 Son</button><button id="sf">🔀 Off</button><button id="sl">⏱ Off</button><button id="fxb">✨ Effets</button></div></div>
<audio id="au" playsinline></audio>

<div id="sheet"><div class="sh">
<input id="en" class="fi" maxlength="90" placeholder="Titre"><input id="ea" class="fi" maxlength="60" placeholder="Artiste"><select id="mv" class="fi"></select>
<div class="chips" id="pre"></div>
<label>Vitesse <b id="sv"></b></label><input type="range" id="sp" min="0.5" max="1.8" step="0.01">
<label>Reverb <b id="rv"></b></label><input type="range" id="rb" min="0" max="100" step="1">
<label>Basses <b id="bv"></b></label><input type="range" id="bsl" min="0" max="12" step="1" value="0">
<label>Écho <b id="ev"></b></label><input type="range" id="esl" min="0" max="100" value="0">
<div class="chips" style="margin-top:12px"><button class="chip" id="d8">🎧 Effet 8D</button></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
<button class="del" id="dl">Supprimer le son</button><button class="btn" id="cl">Fermer</button></div>
</div></div>

<script>
const $=s=>document.querySelector(s);
const au=$('#au');
const PRE=[['Normal',1,0],['Slowed + reverb',.85,45],['Très slowed',.75,60],['Speed up',1.2,0],['Nightcore',1.35,10],['Bass boost',1,10,8,0],['8D',1,25,0,1],['Lo-fi',.95,20,3,0,3200,10],['Underwater',.9,35,0,0,500,0]];
let db=null,pls=[],tracks=[],curPl=null,cur=null,mode='one',editId=null,cache={},tk=0;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* stockage (IndexedDB, avec repli mémoire) */
function openDb(){return new Promise(res=>{try{const r=indexedDB.open('boucle',1);
r.onupgradeneeded=()=>{r.result.createObjectStore('tracks',{keyPath:'id'});r.result.createObjectStore('pl',{keyPath:'id'});};
r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}});}
function dbDo(st,mode,fn){return new Promise(res=>{if(!db)return res([]);try{const t=db.transaction(st,mode);const q=fn(t.objectStore(st));
t.oncomplete=()=>res(q?q.result:null);t.onerror=()=>res([]);}catch(e){res([]);}});}
const put=(st,o)=>dbDo(st,'readwrite',s=>s.put(o));
const del=(st,id)=>dbDo(st,'readwrite',s=>s.delete(id));

async function init(){
  db=await openDb();
  pls=(await dbDo('pl','readonly',s=>s.getAll()))||[];
  tracks=(await dbDo('tracks','readonly',s=>s.getAll()))||[];
  if(!pls.length){const p={id:uid(),name:'Mes sons'};pls.push(p);put('pl',p);}
  curPl=pls[0].id;draw();
}

/* affichage */
function hue(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%360;return h}
function grad(id){const h=hue(id);return`linear-gradient(135deg,hsl(${h},60%,45%),hsl(${(h+50)%360},65%,35%))`;}
function draw(){
  $('#pls').innerHTML=pls.map(p=>`<button class="chip ${p.id===curPl?'on':''}" data-p="${p.id}">${esc(p.name)}</button>`).join('')+`<button class="chip ${curPl==='__fav'?'on':''}" data-p="__fav">♥ Favoris</button>`+'<button class="chip" id="addpl">＋ Playlist</button>';
  $('#pls').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{curPl=b.dataset.p;draw();});
  $('#addpl').onclick=()=>{$('#np').style.display='flex';$('#npi').focus();};
  const qv=($('#q')?$('#q').value:'').toLowerCase();const l=tracks.filter(t=>(curPl==='__fav'?t.fav:t.pl===curPl)&&(!qv||(t.name+' '+(t.artist||'')).toLowerCase().includes(qv)));
  $('#list').innerHTML=l.length?l.map(t=>`<div class="row ${t.id===cur?'cur':''}" data-t="${t.id}">
<div class="cv" style="background:${cvbg(t)}">${t.id===cur?'<span class="eq"><i></i><i></i><i></i></span>':(t.thumb?'':'♪')}</div>
<div class="meta"><div class="nm">${esc(t.name)}</div><div class="fx">${t.artist?esc(t.artist)+' · ':''}${t.speed.toFixed(2)}× · reverb ${t.rev}%${t.bass?' · basses +'+t.bass:''}${t.d8?' · 8D':''}</div></div>
<button class="dots" data-f="${t.id}" aria-label="Favori" style="color:${t.fav?'#ec4899':'var(--mut)'}">${t.fav?'♥':'♡'}</button><button class="dots" data-e="${t.id}" aria-label="Effets">⋯</button></div>`).join(''):
  '<div class="empty"><div class="eico">🎧</div><b>Aucun son ici</b><span>Appuie sur « Ajouter » et choisis une vidéo TikTok ou Instagram enregistrée sur ton téléphone.</span></div>';
  $('#list').querySelectorAll('[data-t]').forEach(r=>r.onclick=e=>{if(e.target.closest('[data-e],[data-f]'))return;play(r.dataset.t);});
  $('#list').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>openSheet(b.dataset.e));
  $('#list').querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{const t=tracks.find(x=>x.id===b.dataset.f);t.fav=!t.fav;await put('tracks',t);draw();});
  $('#dp').innerHTML=(pls.length>1&&curPl!=='__fav')?'<button class="del" id="dpl">Supprimer cette playlist</button>':'';
  if($('#dpl'))$('#dpl').onclick=delPl;
}
$('#npok').onclick=async()=>{const n=$('#npi').value.trim();if(!n)return;const p={id:uid(),name:n};pls.push(p);await put('pl',p);curPl=p.id;$('#npi').value='';$('#np').style.display='none';draw();};
async function delPl(){const id=curPl;for(const t of tracks.filter(t=>t.pl===id))await del('tracks',t.id);
  tracks=tracks.filter(t=>t.pl!==id);pls=pls.filter(p=>p.id!==id);await del('pl',id);curPl=pls[0].id;draw();}

const tu={};
function turl(t){return tu[t.id]||(tu[t.id]=URL.createObjectURL(t.thumb));}
function cvbg(t){return t.thumb?`url(${turl(t)}) center/cover`:grad(t.id);}
function ls(x){$('#ls').textContent=x;}
function getKey(){try{return localStorage.getItem('bk')||'';}catch(e){return '';}}
async function importLink(){const us=$('#lk').value.match(/https?:\/\/\S+/g)||[];$('#lk').value='';
  for(let i=0;i<us.length;i++){if(us.length>1)ls('Lien '+(i+1)+'/'+us.length+'…');await importOne(us[i]);}}
async function importOne(u){
  const H={'X-Key':getKey()};ls('Recherche du son…');
  try{
    const r=await fetch('/api/info?url='+encodeURIComponent(u),{headers:H});
    if(r.status===401){$('#kw').style.display='flex';$('#kin').focus();ls('Entre la clé d’accès de ton serveur');return;}
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Erreur');
    ls('Téléchargement du son…');
    const a=await fetch('/api/audio?url='+encodeURIComponent(u),{headers:H});
    if(!a.ok){let m='Téléchargement impossible';try{m=(await a.json()).error||m;}catch(e){}throw new Error(m);}
    const blob=await a.blob();
    let thumb=null;if(d.thumb){try{thumb=await (await fetch(d.thumb)).blob();}catch(e){}}
    const t={id:uid(),pl:realPl(),name:(d.track||d.title||'Son').slice(0,90),artist:d.artist||'',blob,thumb,src:u,speed:1,rev:0};
    tracks.push(t);await put('tracks',t);$('#lk').value='';ls('Ajouté ✓');draw();
  }catch(e){$('#lk').value=u;ls(e.message||'Impossible de récupérer ce lien.');}
}
$('#lkb').onclick=importLink;
$('#lk').onkeydown=e=>{if(e.key==='Enter')importLink();};
$('#kok').onclick=()=>{try{localStorage.setItem('bk',$('#kin').value.trim());}catch(e){}$('#kw').style.display='none';importLink();};
const realPl=()=>curPl==='__fav'?pls[0].id:curPl;
let shuf=false,slT=null,slI=0;const SL=[0,15,30,60];
$('#sf').onclick=()=>{shuf=!shuf;$('#sf').textContent=shuf?'🔀 On':'🔀 Off';};
$('#sl').onclick=()=>{slI=(slI+1)%SL.length;clearTimeout(slT);const m=SL[slI];$('#sl').textContent=m?'⏱ '+m+' min':'⏱ Off';
  if(m)slT=setTimeout(()=>{au.pause();slI=0;$('#sl').textContent='⏱ Off';},m*60000);};
$('#q').oninput=()=>draw();
$('#pst').onclick=async()=>{try{$('#lk').value=await navigator.clipboard.readText();importLink();}catch(e){ls('Colle le lien dans le champ puis appuie sur Importer');}};
$('#en').onchange=async()=>{const t=tracks.find(x=>x.id===editId);t.name=$('#en').value.trim()||t.name;await put('tracks',t);draw();if(cur===editId){$('#bt').textContent=t.name;ftSet(t.name);}};
$('#ea').onchange=async()=>{const t=tracks.find(x=>x.id===editId);t.artist=$('#ea').value.trim();await put('tracks',t);draw();};
$('#mv').onchange=async()=>{const t=tracks.find(x=>x.id===editId);t.pl=$('#mv').value;await put('tracks',t);draw();};
$('#bsl').oninput=()=>chg();
$('#d8').onclick=()=>{$('#d8').classList.toggle('on');const t=tracks.find(x=>x.id===editId);t.d8=$('#d8').classList.contains('on');chg();};
function fthumb(f){return new Promise(res=>{if(!f.type.startsWith('video'))return res(null);
  const v=document.createElement('video'),u=URL.createObjectURL(f);v.muted=true;v.playsInline=true;v.preload='auto';
  const done=b=>{URL.revokeObjectURL(u);res(b);};setTimeout(()=>done(null),5000);
  v.onloadeddata=()=>{v.currentTime=Math.min(.5,(v.duration||1)/2);};
  v.onseeked=()=>{try{const c=document.createElement('canvas'),m=Math.min(v.videoWidth,v.videoHeight);c.width=c.height=256;
    c.getContext('2d').drawImage(v,(v.videoWidth-m)/2,(v.videoHeight-m)/2,m,m,0,0,256,256);c.toBlob(b=>done(b),'image/jpeg',.8);}catch(e){done(null);}};
  v.onerror=()=>done(null);v.src=u;});}
const IC8={'Normal':'◎','Slowed + reverb':'🌙','Très slowed':'🐌','Speed up':'⚡','Nightcore':'🦋','Bass boost':'🔊','8D':'🎧','Lo-fi':'📻','Underwater':'🌊'};
let curH=270,raf=0,ty=0;
function mkEnv(b){const d=b.getChannelData(0),st=Math.floor(b.sampleRate/30),n=Math.floor(d.length/st),e=new Float32Array(n);let m=1e-6;
  for(let i=0;i<n;i++){let a=0;for(let j=0;j<st;j+=8){const v=d[i*st+j];a+=v*v;}e[i]=Math.sqrt(a/(st/8));if(e[i]>m)m=e[i];}
  for(let i=0;i<n;i++)e[i]=Math.pow(e[i]/m,.8);return e;}
async function pal(t){if(!t.thumb)return hue(t.id);
  try{const b=await createImageBitmap(t.thumb),c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');x.drawImage(b,0,0,16,16);
    const d=x.getImageData(0,0,16,16).data;let best=-1,bh=hue(t.id);
    for(let i=0;i<d.length;i+=4){const r=d[i]/255,g=d[i+1]/255,bl=d[i+2]/255,mx=Math.max(r,g,bl),mn=Math.min(r,g,bl),sat=mx-mn,sc=sat*(1-Math.abs(mx+mn-1));
      if(sc>best){best=sc;let h=0;if(sat>0){h=mx===r?((g-bl)/sat)%6:mx===g?(bl-r)/sat+2:(r-g)/sat+4;h*=60;if(h<0)h+=360;}bh=h;}}
    return Math.round(bh);}catch(e){return hue(t.id);}}
function applyH(h){curH=h;const r=document.documentElement.style;
  r.setProperty('--g',`linear-gradient(135deg,hsl(${h} 80% 56%),hsl(${(h+55)%360} 85% 58%))`);r.setProperty('--ac',`hsl(${h} 85% 68%)`);$('#pl2').style.setProperty('--h',h);}
function ftSet(n){const f=$('#ft');f.classList.remove('mq');f.innerHTML='<span>'+esc(n)+'</span>';
  requestAnimationFrame(()=>{const sp=f.firstChild;if(sp&&sp.offsetWidth>f.clientWidth){f.classList.add('mq');sp.innerHTML=esc(n)+'&emsp;&emsp;'+esc(n);}});}
function startViz(){if(!raf)raf=requestAnimationFrame(frame);}
function frame(){raf=0;if(au.paused||!$('#pl2').classList.contains('o'))return;
  const c=cache[cur],env=c&&c.env;
  if(env){const i=Math.floor(au.currentTime*30),cv=$('#vz'),g=cv.getContext('2d'),W=cv.width,H=cv.height,N=30,bw=W/N,L=env.length-1;
    g.clearRect(0,0,W,H);g.fillStyle=`hsl(${curH} 90% 68%)`;
    for(let k=0;k<N;k++){const v=env[Math.min(L,Math.max(0,i+k-N/2))]||0,h=Math.max(6,v*H*.95);g.beginPath();
      if(g.roundRect)g.roundRect(k*bw+bw*.2,(H-h)/2,bw*.6,h,bw*.3);else g.rect(k*bw+bw*.2,(H-h)/2,bw*.6,h);g.fill();}
    $('#art').style.setProperty('--pulse',1+(env[Math.min(L,i)]||0)*.05);}
  raf=requestAnimationFrame(frame);}
$('#mpv').onclick=e=>{e.stopPropagation();step(-1);};
$('#mnx').onclick=e=>{e.stopPropagation();step(1);};
$('#esl').oninput=()=>chg();
$('#hrt').onclick=async()=>{const t=tracks.find(x=>x.id===cur);if(!t)return;t.fav=!t.fav;await put('tracks',t);$('#hrt').textContent=t.fav?'♥':'♡';draw();
  if(t.fav)for(let k=0;k<12;k++){const e=document.createElement('i'),a=Math.random()*6.28,d=40+Math.random()*50;e.className='pt';
    e.style.setProperty('--dx',Math.cos(a)*d+'px');e.style.setProperty('--dy',Math.sin(a)*d+'px');e.style.background=`hsl(${curH+Math.random()*60} 90% 65%)`;
    $('#hw').appendChild(e);setTimeout(()=>e.remove(),700);}};
$('#pl2').addEventListener('touchstart',e=>{ty=e.touches[0].clientY;},{passive:true});
$('#pl2').addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-ty>120&&$('#pl2').scrollTop<=0)$('#pl2').classList.remove('o');},{passive:true});
/* ajout */
$('#f').onchange=async e=>{
  for(const f of e.target.files){
    const t={id:uid(),pl:realPl(),name:f.name.replace(/\.[^.]+$/,''),blob:f,thumb:await fthumb(f),speed:1,rev:0};
    tracks.push(t);await put('tracks',t);
  }
  e.target.value='';draw();
};

/* effets */
function impulse(ctx,sec){const n=Math.floor(ctx.sampleRate*sec),ir=ctx.createBuffer(2,n,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);}return ir;}
function toWav(b){const ch=b.numberOfChannels,len=b.length,sr=b.sampleRate,o=new DataView(new ArrayBuffer(44+len*ch*2));
  const w=(p,s)=>{for(let i=0;i<s.length;i++)o.setUint8(p+i,s.charCodeAt(i));};
  w(0,'RIFF');o.setUint32(4,36+len*ch*2,true);w(8,'WAVEfmt ');o.setUint32(16,16,true);o.setUint16(20,1,true);o.setUint16(22,ch,true);
  o.setUint32(24,sr,true);o.setUint32(28,sr*ch*2,true);o.setUint16(32,ch*2,true);o.setUint16(34,16,true);w(36,'data');o.setUint32(40,len*ch*2,true);
  const d=[];for(let c=0;c<ch;c++)d.push(b.getChannelData(c));let p=44;
  for(let i=0;i<len;i++)for(let c=0;c<ch;c++){const v=Math.max(-1,Math.min(1,d[c][i]));o.setInt16(p,v<0?v*32768:v*32767,true);p+=2;}
  return new Blob([o],{type:'audio/wav'});}
async function getUrl(t){
  const key=t.speed+'|'+t.rev+'|'+(t.bass||0)+'|'+(t.d8?1:0)+'|'+(t.lp||0)+'|'+(t.echo||0);
  if(cache[t.id]&&cache[t.id].key===key)return cache[t.id].url;
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  const buf=await ac.decodeAudioData(await t.blob.arrayBuffer());ac.close();
  const sr=44100,wet=t.rev/100,tail=(wet>0||t.echo)?2.5:0;
  const ctx=new OfflineAudioContext(2,Math.ceil((buf.duration/t.speed+tail)*sr),sr);
  const s=ctx.createBufferSource();s.buffer=buf;s.playbackRate.value=t.speed;
  let h=s;
  if(t.bass){const b=ctx.createBiquadFilter();b.type='lowshelf';b.frequency.value=180;b.gain.value=t.bass;h.connect(b);h=b;}
  if(t.d8){const pn=ctx.createStereoPanner(),o=ctx.createOscillator();o.frequency.value=.13;o.connect(pn.pan);o.start();h.connect(pn);h=pn;}
  if(t.lp){const lf=ctx.createBiquadFilter();lf.type='lowpass';lf.frequency.value=t.lp;h.connect(lf);h=lf;}
  const dry=ctx.createGain();dry.gain.value=1-wet*.35;h.connect(dry);dry.connect(ctx.destination);
  if(t.echo){const dl=ctx.createDelay(1),fb=ctx.createGain(),eg=ctx.createGain();dl.delayTime.value=.3;fb.gain.value=.4;eg.gain.value=t.echo/100*.6;h.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(eg);eg.connect(ctx.destination);}
  if(wet>0){const cv=ctx.createConvolver();cv.buffer=impulse(ctx,2.5);const g=ctx.createGain();g.gain.value=wet*.9;h.connect(cv);cv.connect(g);g.connect(ctx.destination);}
  s.start();
  const out=await ctx.startRendering();const env=mkEnv(out);const url=URL.createObjectURL(toWav(out));
  if(cache[t.id])URL.revokeObjectURL(cache[t.id].url);
  cache[t.id]={key,url,env};return url;
}

const IC={play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'};
function bs(x){$('#bs').textContent=x;$('#fs').textContent=x;}
function setNow(t){const g=cvbg(t);$('#disc').textContent=t.thumb?'':'♪';$('#mcv').textContent=t.thumb?'':'♪';
  $('#bt').textContent=t.name;ftSet(t.name);$('#mcv').style.background=g;$('#disc').style.background=g;
  $('#art').style.setProperty('--sp',(8/t.speed)+'s');$('#hrt').textContent=t.fav?'♥':'♡';$('#mini').classList.add('on');pal(t).then(applyH);}
const fmt=x=>isFinite(x)?Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0'):'0:00';
let seeking=false;
au.ontimeupdate=()=>{const d=au.duration||0,p=d?au.currentTime/d:0;$('#mp').style.width=p*100+'%';
  if(!seeking){$('#sk').value=p*1000;$('#sk').style.setProperty('--p',p*100+'%');}
  $('#t1').textContent=fmt(au.currentTime);$('#t2').textContent=fmt(d);};
$('#sk').oninput=e=>{seeking=true;$('#sk').style.setProperty('--p',e.target.value/10+'%');au.currentTime=e.target.value/1000*(au.duration||0);};
$('#sk').onchange=()=>{seeking=false;};
$('#mini').onclick=()=>{$('#pl2').classList.add('o');startViz();};
$('#xc').onclick=()=>$('#pl2').classList.remove('o');
$('#fxb').onclick=()=>{if(cur)openSheet(cur);};
/* lecture */
let unlocked=false;
function unlock(){if(unlocked)return;unlocked=true;
  au.src=URL.createObjectURL(toWav(new AudioContext().createBuffer(1,4410,44100)));au.play().catch(()=>{});}
async function play(id){
  const t=tracks.find(x=>x.id===id);if(!t)return;
  unlock();cur=id;const my=++tk;
  setNow(t);bs('Préparation du son…');draw();
  try{const url=await getUrl(t);if(my!==tk)return;
    au.src=url;au.loop=mode==='one';await au.play();
    bs(t.speed.toFixed(2)+'× · reverb '+t.rev+'%');
    if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:t.artist||'meikilab',artwork:t.thumb?[{src:turl(t)}]:[]});
  }catch(e){if(my===tk)bs('Appuie sur ▶ pour lancer');}
  sync();
}
function sync(){const h=au.paused?IC.play:IC.pause;$('#pp').innerHTML=h;$('#pp2').innerHTML=h;document.body.classList.toggle('paused',au.paused);if('mediaSession' in navigator)navigator.mediaSession.playbackState=au.paused?'paused':'playing';}
au.onplay=()=>{sync();startViz();};au.onpause=sync;
au.onended=()=>{if(mode==='all')step(1);};
function step(d){const c=tracks.find(x=>x.id===cur);if(!c)return;const l=tracks.filter(t=>t.pl===c.pl);if(!l.length)return;
  if(shuf&&l.length>1){let n;do{n=l[Math.floor(Math.random()*l.length)];}while(n.id===cur);return play(n.id);}
  const i=l.findIndex(t=>t.id===cur);play(l[(i+d+l.length)%l.length].id);}
$('#pp').onclick=$('#pp2').onclick=e=>{if(e&&e.stopPropagation)e.stopPropagation();if(!cur){const f=tracks.find(t=>t.pl===curPl);if(f)play(f.id);return;}au.paused?au.play():au.pause();};
$('#nx').onclick=()=>step(1);$('#pv').onclick=()=>step(-1);
$('#lp').onclick=()=>{mode=mode==='one'?'all':'one';au.loop=mode==='one';$('#lp').textContent=mode==='one'?'🔂 Son':'🔁 Liste';};
if('mediaSession' in navigator){const m=navigator.mediaSession;
  m.setActionHandler('play',()=>au.play());m.setActionHandler('pause',()=>au.pause());
  m.setActionHandler('nexttrack',()=>step(1));m.setActionHandler('previoustrack',()=>step(-1));}

/* feuille d’effets */
let st=null;
function openSheet(id){editId=id;const t=tracks.find(x=>x.id===id);$('#en').value=t.name;$('#ea').value=t.artist||'';$('#mv').innerHTML=pls.map(p=>`<option value="${p.id}"${p.id===t.pl?' selected':''}>${esc(p.name)}</option>`).join('');$('#bsl').value=t.bass||0;$('#esl').value=t.echo||0;$('#d8').classList.toggle('on',!!t.d8);
  $('#sp').value=t.speed;$('#rb').value=t.rev;lab();
  $('#pre').innerHTML=PRE.map((p,i)=>`<button class="pc" data-i="${i}"><b>${IC8[p[0]]||'🎵'}</b>${p[0]}</button>`).join('');
  $('#pre').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const p=PRE[b.dataset.i];$('#sp').value=p[1];$('#rb').value=p[2];$('#bsl').value=p[3]||0;const tt=tracks.find(x=>x.id===editId);tt.d8=!!p[4];tt.lp=p[5]||0;$('#esl').value=p[6]||0;$('#d8').classList.toggle('on',!!p[4]);chg();});
  $('#sheet').classList.add('o');}
function lab(){$('#ev').textContent=$('#esl').value+'%';$('#bv').textContent=$('#bsl').value+' dB';$('#sv').textContent=(+$('#sp').value).toFixed(2)+'×';$('#rv').textContent=$('#rb').value+'%';}
async function chg(){lab();const t=tracks.find(x=>x.id===editId);t.speed=+$('#sp').value;t.rev=+$('#rb').value;t.bass=+$('#bsl').value;t.echo=+$('#esl').value;
  await put('tracks',t);draw();clearTimeout(st);st=setTimeout(()=>{if(cur===editId)play(editId);},500);}
$('#sp').oninput=chg;$('#rb').oninput=chg;
$('#cl').onclick=()=>$('#sheet').classList.remove('o');
$('#dl').onclick=async()=>{const id=editId;if(cur===id){au.pause();au.removeAttribute('src');cur=null;$('#bt').textContent='Aucun son';bs('');sync();}
  tracks=tracks.filter(t=>t.id!==id);await del('tracks',id);$('#sheet').classList.remove('o');draw();};
sync();init();
</script>
